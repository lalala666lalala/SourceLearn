[project]
name = "sourcelearn"
version = "0.1.0"
description = "From Knowledge Access to Source Learning: Developing Source-Specific Competence"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "tiktoken>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcelearn"]
